name: Publish SwiftUI Navigation Adapter (SPM & CocoaPods)

# Publish after TaqlynSDK is tagged on GitHub / CocoaPods Trunk.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-nav-swiftui-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-spm:
    name: Verify Swift Package (SPM)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Validate Package.swift Manifest
        run: swift package dump-package > /dev/null

      - name: Run SPM Tests
        run: swift test

  publish-cocoapods:
    name: Publish to CocoaPods Trunk
    needs: publish-spm
    runs-on: macos-14
    env:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Podspec
        run: pod ipc spec TaqlynNavSwiftUI.podspec > /dev/null

      - name: Skip CocoaPods Trunk
        if: env.COCOAPODS_TRUNK_TOKEN == ''
        run: echo "COCOAPODS_TRUNK_TOKEN is not set; skipping Trunk publish. SPM still works from the Git tag."

      - name: Push to CocoaPods Trunk
        if: env.COCOAPODS_TRUNK_TOKEN != ''
        run: pod trunk push TaqlynNavSwiftUI.podspec --allow-warnings
